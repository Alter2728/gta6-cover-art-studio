<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio — GTA 6-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Sunset Cover Studio</h1>
    <p class="lede">Your photos, a Vice City sunset, one bold caption — exported as a PNG to share.</p>

    <fieldset>
      <legend>Photos (up to 3, read on your machine)</legend>
      <label>Photo 1 <input id="photo1" type="file" accept="image/*"></label>
      <label>Photo 2 <input id="photo2" type="file" accept="image/*"></label>
      <label>Photo 3 <input id="photo3" type="file" accept="image/*"></label>
      <button id="loadSamples" type="button">Load sample photos</button>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="row">
        <button type="button" data-group="layout" data-value="strip3">Sunset Strip</button>
        <button type="button" data-group="layout" data-value="full">Full Bleed</button>
        <button type="button" data-group="layout" data-value="split2">Split Screen</button>
        <button type="button" data-group="layout" data-value="grid4">Four Corners</button>
      </div>
      <p class="hint">Click a panel to select it, then drag to pan, scroll to zoom, arrow keys to nudge.</p>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="row">
        <button type="button" data-group="grade" data-value="vice">Vice Sunset</button>
        <button type="button" data-group="grade" data-value="pastel">Pastel Dawn</button>
        <button type="button" data-group="grade" data-value="neon">Neon Nights</button>
        <button type="button" data-group="grade" data-value="gold">Palm Gold</button>
      </div>
      <label>Grade intensity <span id="gradeIntensityValue">80%</span>
        <input id="gradeIntensity" type="range" min="0" max="100" value="80">
      </label>
      <label>Neon glow <span id="neonGlowValue">70%</span>
        <input id="neonGlow" type="range" min="0" max="100" value="70">
      </label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Headline <input id="headline" type="text" maxlength="40" value="VICE CITY"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="60" value="Welcome back to Vice City"></label>
      <div class="row">
        <button type="button" data-preset="VICE CITY">VICE CITY</button>
        <button type="button" data-preset="SUNSET DRIVE">SUNSET DRIVE</button>
        <button type="button" data-preset="NEON RIDE">NEON RIDE</button>
        <button type="button" data-preset="PIER PRESSURE">PIER PRESSURE</button>
      </div>
      <div class="row">
        <button type="button" data-group="ink" data-value="white">White ink</button>
        <button type="button" data-group="ink" data-value="gold">Gold ink</button>
        <button type="button" data-group="ink" data-value="neon">Neon ink</button>
        <button type="button" data-group="ink" data-value="ink">Midnight ink</button>
      </div>
      <button id="shuffle" type="button">Shuffle the composition</button>
    </fieldset>

    <fieldset>
      <legend>Export PNG</legend>
      <div class="row">
        <button type="button" data-group="size" data-value="1080x1080">1080 x 1080</button>
        <button type="button" data-group="size" data-value="1080x1350">1080 x 1350</button>
        <button type="button" data-group="size" data-value="1920x1080">1920 x 1080</button>
      </div>
      <div class="row">
        <button type="button" class="primary" data-export="1080x1080">Export square</button>
        <button type="button" class="primary" data-export="1080x1350">Export portrait</button>
        <button type="button" class="primary" data-export="1920x1080">Export landscape</button>
      </div>
      <p id="status" role="status"></p>
    </fieldset>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" tabindex="0" aria-label="The cover preview. Click a panel, drag to pan, scroll to zoom, arrow keys to nudge."></canvas>
  </section>
</main>
<script type="module" src="./src/main.mjs"></script>
</body>
</html>
